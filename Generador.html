<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de QR de empleados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      body { background: #fff !important; }
      .tarjeta { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-6xl mx-auto p-4">

    <div class="print:hidden mb-4 space-y-3">
      <h1 class="text-2xl font-bold text-blue-900">Generador de QR de empleados</h1>
      <p class="text-sm text-gray-600">
        Carga los empleados ACTIVOS desde la hoja, filtra por área si quieres y usa “Imprimir”
        (o “Guardar como PDF”) para obtener los carnets.
      </p>
      <div class="flex flex-wrap gap-2 items-center">
        <button id="btnCargar" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Cargar empleados</button>
        <select id="filtroArea" class="border rounded-lg py-2 px-3 bg-white" disabled>
          <option value="">Todas las áreas</option>
        </select>
        <button id="btnImprimir" class="bg-gray-800 text-white font-bold py-2 px-4 rounded-lg" disabled>Imprimir / PDF</button>
        <span id="contador" class="text-sm text-gray-600"></span>
      </div>
    </div>

    <div id="grilla" class="grid gap-3 grid-cols-2 md:grid-cols-3 print:grid-cols-3"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbynV8QER-iZcVsVG5sLbx_jjX80glQcxOfegaVHgICVx5Q2eDU0usIvxhvY6yvjfpFpIQ/exec";

    const $ = id => document.getElementById(id);
    let empleados = [];

    function sinTildes(s) {
      return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function obtenerClave(forzar) {
      let clave = "";
      try { clave = sessionStorage.getItem("clave_admin") || ""; } catch (e) {}
      if (!clave || forzar) {
        clave = prompt("Clave de administrador:") || "";
        try { if (clave) sessionStorage.setItem("clave_admin", clave); } catch (e) {}
      }
      return clave;
    }

    async function cargar() {
      const clave = obtenerClave(false);
      if (!clave) return;
      $("btnCargar").disabled = true;
      $("btnCargar").textContent = "Cargando…";
      try {
        const resp = await fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: "listar", clave }) });
        const datos = await resp.json();
        if (datos.estado === "CLAVE_INVALIDA") {
          try { sessionStorage.removeItem("clave_admin"); } catch (e) {}
          alert("Clave incorrecta.");
          return;
        }
        if (!datos.ok) { alert("Error: " + (datos.mensaje || "desconocido")); return; }
        empleados = datos.empleados;
        llenarAreas();
        render();
        $("btnImprimir").disabled = false;
        $("filtroArea").disabled = false;
      } catch (e) {
        alert("No se pudo conectar con el servidor: " + e.message);
      } finally {
        $("btnCargar").disabled = false;
        $("btnCargar").textContent = "Cargar empleados";
      }
    }

    function llenarAreas() {
      const areas = [...new Set(empleados.map(e => e.area).filter(Boolean))].sort();
      const sel = $("filtroArea");
      sel.innerHTML = '<option value="">Todas las áreas</option>';
      areas.forEach(a => {
        const o = document.createElement("option");
        o.value = a;
        o.textContent = a;
        sel.appendChild(o);
      });
    }

    function render() {
      const area = $("filtroArea").value;
      const lista = empleados.filter(e => !area || e.area === area);
      const grilla = $("grilla");
      grilla.innerHTML = "";
      $("contador").textContent = lista.length + " empleado(s)";

      lista.forEach(e => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "tarjeta bg-white border rounded-xl p-3 flex flex-col items-center text-center";

        const qrBox = document.createElement("div");
        tarjeta.appendChild(qrBox);

        // Datos dentro del QR (sin tildes para un QR más limpio). f = firma de seguridad.
        const payload = JSON.stringify({
          c: e.codigo,
          d: e.dni,
          n: sinTildes(e.nombres + " " + e.apellidos),
          a: sinTildes(e.area),
          f: e.firma
        });
        new QRCode(qrBox, { text: payload, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });

        const nombre = document.createElement("p");
        nombre.className = "font-bold mt-2 text-sm";
        nombre.textContent = e.nombres + " " + e.apellidos;
        const detalle = document.createElement("p");
        detalle.className = "text-xs text-gray-600";
        detalle.textContent = e.codigo + " · DNI " + e.dni;
        const areaTxt = document.createElement("p");
        areaTxt.className = "text-xs text-gray-600";
        areaTxt.textContent = e.area;

        tarjeta.appendChild(nombre);
        tarjeta.appendChild(detalle);
        tarjeta.appendChild(areaTxt);
        grilla.appendChild(tarjeta);
      });
    }

    $("btnCargar").addEventListener("click", cargar);
    $("filtroArea").addEventListener("change", render);
    $("btnImprimir").addEventListener("click", () => window.print());
  </script>
</body>
</html>
